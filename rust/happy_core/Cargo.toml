[package]
name = "happy_core"
version = "0.1.0"
edition = "2021"
description = "Native hot-path core for happy_flutter: batch AES-256-GCM and message pipeline work moved off the Dart UI isolate."
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
flutter_rust_bridge = "=2.13.0"
# AES-GCM's rand_core dependency resolves getrandom 0.2. Enable its Web
# Crypto backend so the same crate compiles for the FRB WASM target.
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
# flutter_rust_bridge's macro emits `#[cfg(frb_expand)]`; declare it so the
# unexpected-cfg lint stays useful for genuine typos.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
