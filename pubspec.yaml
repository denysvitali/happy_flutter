name: happy_flutter
description: Mobile/web client for Claude Code & Codex
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Error tracking
  sentry_flutter: ^9.14.0
  sentry_dio: ^9.14.0
  flutterrific_opentelemetry: ^0.4.0
  # Pinned via dependency_overrides; imported directly for W3C propagation.
  dartastic_opentelemetry: 1.0.2-alpha
  dartastic_opentelemetry_api: 1.0.0-alpha

  # Core dependencies
  dio: ^5.9.0
  native_dio_adapter: ^1.4.0
  socket_io_client: ^3.1.4
  shared_preferences: ^2.5.3
  mmkv: ^2.3.0
  flutter_secure_storage: ^10.3.0

  # State management
  riverpod: ^3.2.0
  flutter_riverpod: ^3.2.0

  # Code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilities
  package_info_plus: ^10.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  meta: ^1.16.0
  crypto: ^3.0.5
  uuid: ^4.5.2
  intl: ^0.20.2
  convert: ^3.1.1
  # pointycastle and ed25519_edwards removed — zero Dart imports
  # (crypto uses 'cryptography' package; Ed25519 uses sodium FFI)
  sodium: ^4.0.0
  cryptography: ^2.7.0
  http: ^1.3.0
  fuzzy: ^0.5.1
  # record 7.x requires Dart >=3.12 (Flutter 3.44), but mise pins Flutter
  # 3.41 (Dart 3.11). Keep 6.x until the project moves to Flutter 3.44+.
  record: ^6.2.1
  archive: ^4.0.9
  sherpa_onnx: ^1.13.0

  # IndexedDB wrapper for web storage (sessions cache quota relief)
  idb_shim: ^2.4.1

  # UI and navigation
  go_router: ^17.0.1
  google_fonts: ^8.0.2
  # webview_flutter removed — zero Dart imports, native plugin bloat
  flutter_tts: ^4.2.0
  # Offline TTS playback (sherpa_onnx generates Float32 PCM; we wrap
  # in WAV via sherpa.writeWave and hand the file to just_audio).
  # We use just_audio rather than audioplayers because the latter's
  # Android plugin drags an old android-junit5 Gradle plugin into the
  # buildscript classpath, which 403s through the CI's Maven proxy.
  just_audio: ^0.10.4
  # audio_session is a transitive dependency of just_audio, but we now
  # import it directly in OfflineTtsService to configure ducking audio
  # focus (transient-may-duck on Android, AVAudioSessionCategoryOptions
  # `.duckOthers` + `.mixWithOthers` on iOS). Promote to a direct dep
  # to silence `depend_on_referenced_packages`.
  audio_session: ^0.2.0
  url_launcher: ^6.3.1
  qr: ^4.0.0
  flutter_markdown_plus: ^1.0.0
  markdown: ^7.3.0

  flutter_user_certificates_android: ^0.0.1

  # Native platform integrations
  connectivity_plus: ^7.0.0
  # local_auth and geolocator removed — zero callers in lib/
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^22.0.0
  mobile_scanner: ^7.2.0

dependency_overrides:
  # Keep this explicit until the Flutter toolchain's transitive constraints
  # consistently pick an Android implementation with SharedPreferencesPlugin.
  # 2.4.26 requires Dart 3.12 (Flutter 3.44); hold at 2.4.23 for Dart 3.11.
  shared_preferences_android: 2.4.23
  mmkv_platform_interface: 2.4.0
  flutter_secure_storage_linux: 3.0.1
  # flutterrific_opentelemetry 0.4.0 caps go_router at ^14.8.1, but the
  # route observer API used here is compatible with the app's current v17.
  go_router: 17.3.0
  # flutterrific_opentelemetry 0.4.0 has not adopted the beta API yet.
  dartastic_opentelemetry: 1.0.2-alpha
  dartastic_opentelemetry_api: 1.0.0-alpha

  # Force-upgrade overrides (2026-06-15) — unblock transitive
  # constraints flagged by `pub upgrade`. These bypass upstream caps
  # so the resolver picks the latest compatible release. Safe to drop
  # as upstream packages (sentry_flutter, build_runner, etc.) widen
  # their own constraints.
  #
  # NOTE: record 7.x needs Dart ^3.12.0 / Flutter >=3.44.0. mise currently
  # pins Flutter 3.41, so the `^6.2.1` direct-dep constraint below
  # already pins us to 6.x. The 1.x record_* family is held the same
  # way; do not add overrides here.
  #
  # NOTE: analyzer 13.x requires `meta ^1.18.3`, but the Flutter SDK's
  # `flutter_test` pins `meta` to 1.17.0 — an SDK-level pin we cannot
  # override from the project. analyzer stays at 10.2.0 until the project
  # moves to Flutter 3.44+. _fe_analyzer_shared is coupled to analyzer.
  cli_util: 0.5.1
  code_assets: 1.2.1
  # cupertino_http 3.x ships a native-assets build hook (hook/build.dart) that
  # unconditionally compiles Objective-C with -fobjc-arc, so `flutter build
  # linux` tries to build this Apple-only package and fails ("-fobjc-arc is not
  # supported on platforms using the legacy runtime"). 2.4.0 uses the classic
  # darwin/ plugin mechanism, which Flutter only builds on Apple platforms.
  # Pulled in transitively by native_dio_adapter; hold at 2.4.0 until upstream
  # gates the hook on target OS.
  cupertino_http: 2.4.0
  dbus: 0.7.14
  flutter_secure_storage_darwin: 0.4.0
  hooks: 2.0.2
  image: 4.9.1
  injector: 4.0.0
  matcher: 0.12.20
  native_toolchain_c: 0.19.1
  objective_c: 9.4.1
  package_config: 3.0.0
  # NOTE: do NOT force-bump any package whose latest release declares Dart
  # language version 3.12. mise pins Flutter 3.41 (Dart 3.11), and
  # dependency_overrides bypass pub's SDK check — so such a force-pin resolves
  # cleanly but then fails at compile time ("language version 3.12 ... too
  # high"). Leaving these unpinned lets pub pick the newest Dart-3.11-compatible
  # release. Removed for this reason (re-add only after the project moves to
  # Flutter 3.44+):
  #   idb_shim (2.9.4), sembast (3.8.9), synchronized (3.4.1),
  #   and url_launcher_android (6.3.32).
  test: 1.31.1
  test_api: 0.7.12
  test_core: 0.6.18
  vector_math: 2.4.0
  xml: 7.0.1

  # sentry_flutter ^9.14.0 hard-pins jni 0.14.2 — it imports the
  # JObjectNullableType constructor that was removed in jni 1.0.0.
  # cronet_http 1.8.0 and path_provider_android 2.3.1 both require
  # jni ^1.0.0, so the upstream cronet_http / path_provider_android
  # upgrades are blocked until sentry_flutter widens. The pins below
  # make the cap explicit and resistant to accidental future bumps.
  cronet_http: 1.6.0
  jni: 0.14.2
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.3
  mockito: ^5.4.4
  build_runner: ^2.5.0
  freezed: ^3.1.0
  json_serializable: ^6.10.0
  sentry_dart_plugin: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - google_fonts/

  generate: true

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: false
  project: happy_flutter
  org: denvit-hv
  wait_for_processing: false
  log_level: warning
  debug_symbols_path: build/debug-info
