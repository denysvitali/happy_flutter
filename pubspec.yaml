name: happy_flutter
description: Mobile/web client for Claude Code & Codex
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Error tracking
  sentry_flutter: ^9.14.0
  sentry_dio: ^9.14.0
  flutterrific_opentelemetry: ^0.4.0

  # Core dependencies
  dio: ^5.9.0
  native_dio_adapter: ^1.4.0
  socket_io_client: ^3.1.4
  shared_preferences: ^2.5.3
  mmkv: ^2.3.0
  flutter_secure_storage: ^10.3.0

  # State management
  riverpod: ^3.2.0
  flutter_riverpod: ^3.2.0

  # Code generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilities
  package_info_plus: ^10.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  meta: ^1.16.0
  crypto: ^3.0.5
  uuid: ^4.5.2
  intl: ^0.20.2
  convert: ^3.1.1
  # pointycastle and ed25519_edwards removed — zero Dart imports
  # (crypto uses 'cryptography' package; Ed25519 uses sodium FFI)
  sodium: ^4.0.0
  sodium_libs: 4.0.0
  cryptography: ^2.7.0
  http: ^1.3.0
  fuzzy: ^0.5.1
  # record 7.x requires Dart >=3.12 (Flutter 3.44), but devenv/nixpkgs tops
  # out at Flutter 3.41 (Dart 3.11). Keep 6.x until nixpkgs ships 3.44+.
  record: ^7.0.0
  archive: ^4.0.9
  sherpa_onnx: ^1.13.0

  # IndexedDB wrapper for web storage (sessions cache quota relief)
  idb_shim: ^2.4.1

  # UI and navigation
  go_router: ^17.0.1
  google_fonts: ^8.0.2
  # webview_flutter removed — zero Dart imports, native plugin bloat
  flutter_tts: ^4.2.0
  # Offline TTS playback (sherpa_onnx generates Float32 PCM; we wrap
  # in WAV via sherpa.writeWave and hand the file to just_audio).
  # We use just_audio rather than audioplayers because the latter's
  # Android plugin drags an old android-junit5 Gradle plugin into the
  # buildscript classpath, which 403s through the CI's Maven proxy.
  just_audio: ^0.10.4
  url_launcher: ^6.3.1
  qr: ^4.0.0
  web: ^1.1.1
  flutter_markdown_plus: ^1.0.0
  markdown: ^7.3.0

  flutter_user_certificates_android: ^0.0.1

  # Native platform integrations
  connectivity_plus: ^7.0.0
  # local_auth and geolocator removed — zero callers in lib/
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^22.0.0
  mobile_scanner: ^7.2.0
  cached_network_image: ^3.4.1

dependency_overrides:
  # Keep this explicit until the Flutter toolchain's transitive constraints
  # consistently pick an Android implementation with SharedPreferencesPlugin.
  shared_preferences_android: 2.4.23
  mmkv_platform_interface: 2.4.0
  flutter_secure_storage_linux: 3.0.1
  # flutterrific_opentelemetry 0.4.0 caps go_router at ^14.8.1, but the
  # route observer API used here is compatible with the app's current v17.
  go_router: 17.2.3
  # flutterrific_opentelemetry 0.4.0 has not adopted the beta API yet.
  dartastic_opentelemetry: 1.0.2-alpha
  dartastic_opentelemetry_api: 1.0.0-alpha

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.3
  mockito: ^5.4.4
  build_runner: ^2.5.0
  freezed: ^3.1.0
  json_serializable: ^6.10.0
  sentry_dart_plugin: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - google_fonts/

  generate: true

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: false
  project: happy_flutter
  org: denvit-hv
  wait_for_processing: false
  log_level: warning
  debug_symbols_path: build/debug-info
