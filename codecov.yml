coverage:
  status:
    project:
      default:
        # Start with 40% project coverage, increase as tests grow
        target: 40%
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        # Require 50% coverage on changed lines in PRs
        target: 50%
        threshold: 5%
        if_ci_failed: error

ignore:
  - "test/**"
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "lib/generated/**"
