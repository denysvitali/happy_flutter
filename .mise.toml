# Flutter / Dart / Java / Make toolchain for happy_flutter.
#
# Pins Flutter 3.41.9 / Dart 3.11.5 / Java 21 / GNU Make 4.4.1 for
# local development and CI.
# sodium 4.0.2+1 needs Dart ^3.11.0 and Flutter >3.41.0.
# sodium's native build also shells out to make.
#
# Activate with: `mise install` (or `mise use` on first run).
# When paired with direnv, `.envrc` calls `use mise` so flutter /
# dart / java / make land on PATH the moment you `cd` into the repo.
[tools]
flutter = "3.47.2"
dart    = "3.11.5"
java    = "21.0.2"
make    = "4.4.1"

[env]
# Cap the Dart VM heap to match CI and avoid OOMs on heavy local runs.
DART_VM_OPTIONS = "--max-gen-heap-size=4096"
