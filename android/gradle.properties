org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9.0+ defaults android.newDsl=true, which replaces
# BaseAppModuleExtension with ApplicationExtension and turns
# the old resolve into a compilation error. Flutter's Gradle
# plugin still registers the old extension, so opt out for now.
android.newDsl=false
# Workaround: cronet_http (via native_dio_adapter) is compiled against
# android-34 but :jni requires compileSdk 35+. Disable strict AAR
# metadata check until cronet_http is updated.
android.enableNewAarMetadataCheck=false
# Set NDK version to match jni plugin requirements
android.ndkVersion=28.2.13676358

# CI Optimizations
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Run Kotlin compilation in-process to avoid spawning the Kotlin daemon.
# Faster cold-start on CI; harmless on local dev where the Gradle daemon is reused.
kotlin.compiler.execution.strategy=in-process

# Disable Sentry bytecode instrumentation (saves ~30-90s per build)
sentry.tracingInstrumentation.enabled=false
