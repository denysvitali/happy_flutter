org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Set NDK version to match jni plugin requirements
android.ndkVersion=28.2.13676358

# CI Optimizations
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Disable Sentry bytecode instrumentation (saves ~30-90s per build)
sentry.tracingInstrumentation.enabled=false
