org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Set NDK version to match jni plugin requirements
android.ndkVersion=28.2.13676358

# CI Optimizations
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Run Kotlin compilation in-process to avoid spawning the Kotlin daemon.
# Faster cold-start on CI; harmless on local dev where the Gradle daemon is reused.
kotlin.compiler.execution.strategy=in-process

# Disable Sentry bytecode instrumentation (saves ~30-90s per build)
sentry.tracingInstrumentation.enabled=false
