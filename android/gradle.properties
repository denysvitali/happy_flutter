org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
# AGP 9.0+ defaults android.newDsl=true, which replaces
# BaseAppModuleExtension with ApplicationExtension and turns
# the old resolve into a compilation error. Flutter's Gradle
# plugin still registers the old extension, so opt out for now.
android.newDsl=false
# Set NDK version to match jni plugin requirements
android.ndkVersion=28.2.13676358

# CI / local build speed
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Default workers = CPU count (4 on ubuntu-latest). Do not cap at 2.
# Avoid filesystem watches on CI (no long-lived daemon across jobs).
org.gradle.vfs.watch=false
# Run Kotlin compilation in-process — no Kotlin daemon cold-start on CI.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
# Disable Sentry bytecode instrumentation (saves ~30-90s per build)
sentry.tracingInstrumentation.enabled=false
