org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# AGP 9.0+ defaults android.newDsl=true, which replaces
# BaseAppModuleExtension with ApplicationExtension and turns
# the old resolve into a compilation error. Flutter's Gradle
# plugin still registers the old extension, so opt out for now.
android.newDsl=false
# Set NDK version to match jni plugin requirements
android.ndkVersion=28.2.13676358

# CI / local build speed
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# Workers share the 6G heap above; 2 is enough for arm64-only APK.
org.gradle.workers.max=2
# Avoid filesystem watches on CI (no long-lived daemon across jobs).
org.gradle.vfs.watch=false
# Skip the welcome / Kotlin daemon handshake noise on cold CI starts.
kotlin.daemon.enabled=false
kotlin.compiler.execution.strategy=in-process
# Faster Kotlin incremental checks; safe with clean CI workspaces.
kotlin.incremental=true
# R8 already owns minify; keep AGP from re-running unused-resource analysis twice.
android.enableR8.fullMode=true
# Disable Sentry bytecode instrumentation (saves ~30-90s per build)
sentry.tracingInstrumentation.enabled=false
# Don't pull docs/sources jars in CI dependency resolution.
org.gradle.dependency.verification=off
