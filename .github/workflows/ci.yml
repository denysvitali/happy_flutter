name: Happy Flutter CI/CD
# warm-path remeasure seed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR runs; never cancel main-branch runs so the
  # deploy-web → deploy-pages flow is not interrupted (see fa072b98).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Generate and upload refreshed golden screenshots'
        required: false
        default: false
        type: boolean
      build_type:
        description: 'Build type to produce'
        required: true
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both
      flavor:
        description: 'App flavor (environment)'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

env:
  DART_VM_OPTIONS: '--max-gen-heap-size=4096'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Run analyze and test in parallel — both need pub get but are independent after
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-write: 'true'

      - name: Cache pub package downloads
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: >-
            pub-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.mise.toml', 'pubspec.lock') }}
          restore-keys: |
            pub-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Get dependencies
        run: mise exec -- flutter pub get

      - name: Analyze code
        run: mise exec -- flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

  test:
    name: Test (shard ${{ matrix.shard }}/${{ matrix.total_shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total_shards: [8]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          # Shards share the prewarmed SDK; first writer wins.
          cache-write: 'true'

      - name: Cache pub package downloads
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: >-
            pub-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.mise.toml', 'pubspec.lock') }}
          restore-keys: |
            pub-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Get dependencies
        run: mise exec -- flutter pub get

      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total_shards }})
        run: |
          mapfile -t all_tests < <(find test -name '*_test.dart' \
            ! -path 'test/golden/*' | sort)
          total=${#all_tests[@]}
          shard=${{ matrix.shard }}
          num_shards=${{ matrix.total_shards }}
          shard_tests=()
          for i in "${!all_tests[@]}"; do
            if [ $(( i % num_shards )) -eq $(( shard - 1 )) ]; then
              shard_tests+=("${all_tests[$i]}")
            fi
          done
          if [ ${#shard_tests[@]} -eq 0 ]; then
            echo "No tests in this shard, skipping."
            exit 0
          fi
          echo "Running ${#shard_tests[@]} of $total test files (shard ${{ matrix.shard }}/${{ matrix.total_shards }})"
          set +e
          mise exec -- flutter test --no-pub --coverage --concurrency=1 --reporter=expanded "${shard_tests[@]}" 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -n -E -B 20 -A 40 "EXCEPTION CAUGHT|Expected:|Actual:|Which:|TestFailure|Error:|══╡" test-output.log \
              | sed 's/^/::error::/' || true
          fi
          exit "$status"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: ignore

  coverage:
    name: Upload Coverage
    needs: test
    runs-on: ubuntu-latest
    if: always() && needs.test.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          # Concatenate all shard lcov files. Multiple SF (source file) entries
          # for the same file with different line counts get summed by Codecov.
          found=0
          for f in coverage-shards/*/lcov.info; do
            [ -f "$f" ] || continue
            echo "Shard file: $f ($(wc -l < "$f") lines)"
            if [ $found -eq 0 ]; then
              cp "$f" coverage/lcov.info
            else
              # Skip TN: (test name) lines, keep all other lcov records.
              # Codecov sums SF/DA/FN/... lines by source file path.
              grep -v "^TN:" "$f" >> coverage/lcov.info || true
            fi
            found=$((found + 1))
          done
          echo "Merged $found shard coverage files"
          echo "Total lines: $(wc -l < coverage/lcov.info)"
          echo "Source files: $(grep -c '^SF:' coverage/lcov.info)"

      - name: Ensure curl is available
        run: command -v curl >/dev/null || (sudo apt-get update && sudo apt-get install -y curl)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  golden:
    name: Golden Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Verify on non-draft PRs, or generate replacements from a manual run.
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false) ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.update_goldens == true) ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[update-goldens]'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-write: 'true'

      - name: Cache pub package downloads
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: >-
            pub-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.mise.toml', 'pubspec.lock') }}
          restore-keys: |
            pub-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Get dependencies
        run: mise exec -- flutter pub get

      - name: Verify golden tests
        if: github.event_name == 'pull_request'
        # Runs both the phone suite (golden_test.dart) and the tablet suite
        # (tablet_golden_test.dart) in `test/golden/`.
        run: mise exec -- flutter test --no-pub test/golden/

      - name: Generate golden screenshots
        if: >-
          (github.event_name == 'workflow_dispatch' &&
          inputs.update_goldens == true) ||
          (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[update-goldens]'))
        run: >-
          mise exec -- flutter test --no-pub test/golden/
          --update-goldens

      - name: Upload generated golden screenshots
        if: >-
          always() &&
          ((github.event_name == 'workflow_dispatch' &&
          inputs.update_goldens == true) ||
          (github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[update-goldens]')))
        uses: actions/upload-artifact@v7
        with:
          name: updated-goldens-${{ github.sha }}
          path: test/golden/goldens/
          retention-days: 7
          if-no-files-found: error

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on push/PR events (but not tags), or workflow_dispatch with debug or both selected
    if: |
      (github.event_name != 'workflow_dispatch' &&
       !startsWith(github.ref, 'refs/tags/v') &&
       github.ref != 'refs/heads/main') ||
      github.event.inputs.build_type == 'debug' ||
      github.event.inputs.build_type == 'both'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Determine build metadata
        id: build_meta
        run: |
          # Stable across retries of the same run (no run_attempt).
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 ))
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ -z "$FLAVOR" ]; then FLAVOR="production"; fi
          SEMVER=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d'+' -f1 | tr -d ' ')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "FLAVOR=$FLAVOR" >> $GITHUB_OUTPUT
          echo "SEMVER=$SEMVER" >> $GITHUB_OUTPUT

      - name: Prepare signing keystore (optional)
        id: debug_keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_PATH=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ci-keystore.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/ci-keystore.jks" >> $GITHUB_OUTPUT
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          precache-android: 'true'
          cache-write: 'true'

      - name: Setup Android build
        uses: ./.github/actions/setup-android-build
        with:
          # Debug must not write native-hook cache — release is the writer.
          cache-write: 'false'

      - name: Build Debug APK
        run: |
          mise exec -- flutter build apk --debug --no-pub \
            --flavor ${{ steps.build_meta.outputs.FLAVOR }} \
            --target-platform android-arm64 \
            --build-number ${{ steps.build_meta.outputs.BUILD_NUMBER }}
        env:
          APP_ENV: ${{ steps.build_meta.outputs.FLAVOR }}
          KEYSTORE_PATH: ${{ steps.debug_keystore.outputs.KEYSTORE_PATH }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.configureondemand=true
            -Dkotlin.compiler.execution.strategy=in-process

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: happy-flutter-debug-${{ steps.build_meta.outputs.FLAVOR }}-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-${{ steps.build_meta.outputs.FLAVOR }}-debug.apk
          retention-days: 14

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only ship signed release on main/tags/manual release dispatch.
    # PRs and develop use build-debug.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.build_type == 'release' || inputs.build_type == 'both'))
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Determine build metadata
        id: build_meta
        run: |
          # Stable across retries of the same run (no run_attempt).
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 ))
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ -z "$FLAVOR" ]; then FLAVOR="production"; fi
          SEMVER=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d'+' -f1 | tr -d ' ')
          SENTRY_RELEASE="happy_flutter@${SEMVER}+${BUILD_NUMBER}"
          {
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "FLAVOR=$FLAVOR"
            echo "SEMVER=$SEMVER"
            echo "SENTRY_RELEASE=$SENTRY_RELEASE"
          } >> $GITHUB_OUTPUT
          # Expose for sentry_dart_plugin + any later steps.
          {
            echo "SENTRY_RELEASE=$SENTRY_RELEASE"
            echo "SENTRY_DIST=$BUILD_NUMBER"
          } >> $GITHUB_ENV

      - name: Validate + create signing keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is required for release APK generation"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          precache-android: 'true'
          cache-write: 'true'

      - name: Setup Android build
        id: android-setup
        uses: ./.github/actions/setup-android-build
        with:
          cache-write: 'true'

      - name: Build Release APK
        env:
          APP_ENV: ${{ steps.build_meta.outputs.FLAVOR }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          # jvmargs live in gradle.properties; keep daemon off on ephemeral VMs.
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
            -Dorg.gradle.configureondemand=true
            -Dkotlin.compiler.execution.strategy=in-process
        run: |
          set +e
          # No --dart-define=SENTRY_RELEASE: runtime PackageInfo supplies it
          # so AOT inputs stay stable across versionCode-only changes.
          # --performance-measurement-file records assemble target times.
          mise exec -- flutter build apk --release --no-pub \
            --flavor ${{ steps.build_meta.outputs.FLAVOR }} \
            --target-platform android-arm64 \
            --build-number ${{ steps.build_meta.outputs.BUILD_NUMBER }} \
            --split-debug-info=build/debug-info \
            --obfuscate \
            --performance-measurement-file=build/flutter-perf.json \
            2>&1 | tee build-release.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Release APK build failed with status $status"
            grep -E -i \
              'FAILURE:|What went wrong|Execution failed|Missing class|OutOfMemory|Could not|Exception|Error:' \
              build-release.log || true
            echo "::group::Release build log tail"
            tail -n 200 build-release.log
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Save native hook outputs
        if: >-
          success() &&
          steps.android-setup.outputs.native-hooks-cache-hit != 'true' &&
          github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .dart_tool/hooks_runner
          key: >-
            native-hooks-v3-${{ runner.os }}-${{ runner.arch }}-android-arm64-${{
            hashFiles('.mise.toml', 'pubspec.lock', 'android/gradle.properties',
            'android/app/build.gradle.kts') }}

      - name: Upload Flutter performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/flutter-perf.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          mise exec -- flutter pub run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DIST: ${{ steps.build_meta.outputs.BUILD_NUMBER }}
          SENTRY_RELEASE: ${{ steps.build_meta.outputs.SENTRY_RELEASE }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: happy-flutter-release-${{ steps.build_meta.outputs.FLAVOR }}-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-${{ steps.build_meta.outputs.FLAVOR }}-release.apk
          retention-days: 14

      - name: Upload debug info artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-info-release-${{ steps.build_meta.outputs.FLAVOR }}-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: build/debug-info/
          retention-days: 90

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both')) ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libcurl4-openssl-dev

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-write: 'true'

      - name: Cache pub package downloads
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: >-
            pub-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.mise.toml', 'pubspec.lock') }}
          restore-keys: |
            pub-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Get dependencies
        run: mise exec -- flutter pub get

      - name: Compute build metadata
        id: build_meta
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 ))
          SEMVER=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d'+' -f1 | tr -d ' ')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "SENTRY_RELEASE=happy_flutter@${SEMVER}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build Linux x64 Release
        run: |
          # Linux keeps dart-define for Sentry identity (no PackageInfo
          # path change required for this platform in this PR).
          mise exec -- flutter build linux --release --no-pub \
            --dart-define=SENTRY_RELEASE=${{ steps.build_meta.outputs.SENTRY_RELEASE }} \
            --dart-define=SENTRY_DIST=${{ steps.build_meta.outputs.BUILD_NUMBER }}

      - name: Bundle release archive
        run: |
          cp scripts/install-linux.sh assets/icon/app_icon.png \
            build/linux/x64/release/bundle/
          chmod +x build/linux/x64/release/bundle/install-linux.sh
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../happy-flutter-linux-x64.tar.gz .

      - name: Upload Linux x64 Bundle
        uses: actions/upload-artifact@v7
        with:
          name: happy-flutter-linux-x64-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: happy-flutter-linux-x64.tar.gz
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [build-release, build-linux]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute build metadata
        id: build_meta
        run: |
          # Must match build-release / build-linux (no run_attempt).
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Determine release version
        id: release_version
        run: |
          SEMVER=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d ' ')
          RELEASE_TAG="v${SEMVER}-${{ steps.build_meta.outputs.BUILD_NUMBER }}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: happy-flutter-release-${{ github.event.inputs.flavor || 'production' }}-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: release-assets

      - name: Download Linux x64 bundle
        uses: actions/download-artifact@v8
        with:
          name: happy-flutter-linux-x64-b${{ steps.build_meta.outputs.BUILD_NUMBER }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_version.outputs.RELEASE_TAG }}
          name: Happy Flutter ${{ steps.release_version.outputs.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            release-assets/app-${{ github.event.inputs.flavor || 'production' }}-release.apk
            release-assets/happy-flutter-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache-write: 'true'

      - name: Cache pub package downloads
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: >-
            pub-v3-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('.mise.toml', 'pubspec.lock') }}
          restore-keys: |
            pub-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Get dependencies
        run: mise exec -- flutter pub get

      - name: Compute build metadata
        id: build_meta
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 100 ))
          SEMVER=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d'+' -f1 | tr -d ' ')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "SENTRY_RELEASE=happy_flutter@${SEMVER}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build Web
        run: |
          mise exec -- flutter build web --release --no-pub \
            --base-href '/' \
            --source-maps \
            --dart-define=COMMIT_SHA=${{ github.sha }} \
            --dart-define=SENTRY_RELEASE=${{ steps.build_meta.outputs.SENTRY_RELEASE }} \
            --dart-define=SENTRY_DIST=${{ steps.build_meta.outputs.BUILD_NUMBER }}

      - name: Upload web source maps to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        run: |
          mise exec -- flutter pub run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DIST: ${{ steps.build_meta.outputs.BUILD_NUMBER }}
          SENTRY_RELEASE: ${{ steps.build_meta.outputs.SENTRY_RELEASE }}

      - name: Cache-bust assets
        run: |
          # Bust flutter_bootstrap.js so the browser fetches the new bootstrap,
          # which contains the updated serviceWorkerVersion that triggers a
          # service-worker update → fresh main.dart.js + all hashed assets.
          sed -i 's|flutter_bootstrap.js"|flutter_bootstrap.js?v=${{ github.sha }}"|' \
            build/web/index.html
          # Custom domain for GitHub Pages
          echo "happy.denv.it" > build/web/CNAME

      - name: Upload Web Build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 1

  deploy-web:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Web Build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: build/web

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
