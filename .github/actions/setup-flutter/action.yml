name: Setup Flutter (prewarmed)
description: >
  Install Flutter via mise (or the ARM64 host fallback) and restore a
  platform-trimmed, prewarmed SDK.

inputs:
  platform:
    description: >
      SDK payload required by this job (host, host-arm64, android, ios, or web).
    required: false
    default: host
  cache-write:
    description: Whether this job may write the prewarmed SDK cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Restore host Flutter SDK
      id: flutter-host
      if: inputs.platform == 'host'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
        key: >-
          mise-flutter-host-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}
        restore-keys: |
          mise-flutter-host-v4-${{ runner.os }}-${{ runner.arch }}-

    # Flutter 3.41.9 does not publish a Linux ARM64 host SDK. The ARM job
    # seeds the same cache with the x64 Flutter framework/tool bundle plus the
    # ARM64 Dart SDK and Linux engine artifacts in the next steps.
    - name: Restore ARM64 host Flutter SDK
      id: flutter-host-arm
      if: inputs.platform == 'host-arm64'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
        key: >-
          mise-flutter-host-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}
        restore-keys: |
          mise-flutter-host-v4-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore Android Flutter SDK
      id: flutter-android
      if: inputs.platform == 'android'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/linux-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm-profile/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm-release/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm64-profile/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-x86/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-x64*/**
        key: >-
          mise-flutter-android-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}
        restore-keys: |
          mise-flutter-android-v4-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore web Flutter SDK
      id: flutter-web
      if: inputs.platform == 'web'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/linux-*/**
        key: >-
          mise-flutter-web-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}
        restore-keys: |
          mise-flutter-web-v4-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore iOS Flutter SDK
      id: flutter-ios
      if: inputs.platform == 'ios'
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/linux-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
        key: >-
          mise-flutter-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}
        restore-keys: |
          mise-flutter-ios-v1-${{ runner.os }}-${{ runner.arch }}-

    # Seed each new trimmed cache from the existing full SDK cache. This only
    # runs on the first v4 miss, avoiding a cold Flutter download on rollout.
    - name: Restore legacy full Flutter SDK
      if: >-
        ${{ (inputs.platform == 'host' &&
        steps.flutter-host.outputs.cache-hit != 'true') ||
        (inputs.platform == 'android' &&
        steps.flutter-android.outputs.cache-hit != 'true') ||
        (inputs.platform == 'web' &&
        steps.flutter-web.outputs.cache-hit != 'true') ||
        (inputs.platform == 'ios' &&
        steps.flutter-ios.outputs.cache-hit != 'true') }}
      uses: actions/cache/restore@v5
      with:
        path: ~/.local/share/mise
        key: >-
          mise-flutter-prewarmed-v3-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}
        restore-keys: |
          mise-flutter-prewarmed-v3-${{ runner.os }}-${{ runner.arch }}-

    - name: Setup mise (Flutter + Java)
      if: inputs.platform != 'host-arm64'
      uses: jdx/mise-action@v3
      with:
        install: true
        # Flutter ships Dart. Keep Java installed because mise activates the
        # complete repository toolset before each `mise exec` command.
        install_args: flutter java
        # Manual restore/save around the warm step so the snapshot lands
        # in the cache. mise-action's internal cache saves before warm.
        cache: false

    - name: Setup mise (Java on ARM64)
      if: inputs.platform == 'host-arm64'
      uses: jdx/mise-action@v3
      with:
        install: true
        install_args: java
        cache: false

    - name: Setup ARM64 host Flutter SDK
      if: inputs.platform == 'host-arm64'
      shell: bash
      run: |
        set -euo pipefail
        FLUTTER_VERSION=$(awk '/^flutter =/ {gsub(/"/, "", $3); print $3}' .mise.toml)
        FLUTTER_ROOT="$HOME/.local/share/mise/installs/flutter/$FLUTTER_VERSION"
        if [ ! -x "$FLUTTER_ROOT/bin/flutter" ]; then
          mkdir -p "$FLUTTER_ROOT"
          curl -fsSL --retry 3 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            | tar -xJ --strip-components=1 -C "$FLUTTER_ROOT"
        fi

        # The Flutter archive contains an x64 Dart SDK. Replace it with the
        # ARM64 SDK from the matching engine revision so the Flutter tool runs
        # natively on this runner.
        export PATH="$FLUTTER_ROOT/bin:$FLUTTER_ROOT/bin/cache/dart-sdk/bin:$PATH"
        if ! "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" --version >/dev/null 2>&1; then
          rm -rf "$FLUTTER_ROOT/bin/cache/dart-sdk"
          rm -f "$FLUTTER_ROOT/bin/cache/engine-dart-sdk.stamp"
          "$FLUTTER_ROOT/bin/internal/update_dart_sdk.sh"
        fi

        # The archive also contains an x64 Flutter tool snapshot. Rebuild it
        # once with the ARM64 Dart VM before invoking the Flutter wrapper.
        ARM_SNAPSHOT_MARKER="$FLUTTER_ROOT/bin/cache/flutter_tools.arm64"
        if [ ! -f "$ARM_SNAPSHOT_MARKER" ]; then
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp"
        fi

        # Keep using `mise exec` for repository commands without asking mise
        # to resolve the x64-only Flutter entry in the project config.
        MISE_CONFIG_FILE="$RUNNER_TEMP/mise-arm64.toml"
        touch "$MISE_CONFIG_FILE"
        export MISE_CONFIG_FILE
        echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
        echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
        echo "MISE_CONFIG_FILE=$MISE_CONFIG_FILE" >> "$GITHUB_ENV"
        mise exec -- flutter --version
        if [ '${{ steps.flutter-host-arm.outputs.cache-hit }}' != 'true' ]; then
          mise exec -- flutter precache --linux
        fi
        touch "$ARM_SNAPSHOT_MARKER"

    - name: Warm Flutter CLI
      if: inputs.platform != 'host-arm64'
      shell: bash
      run: |
        set -euo pipefail
        mise exec -- flutter --version
        cache_hit=''
        case "${{ inputs.platform }}" in
          host)
            cache_hit='${{ steps.flutter-host.outputs.cache-hit }}'
            platform_flag='--linux'
            ;;
          android)
            cache_hit='${{ steps.flutter-android.outputs.cache-hit }}'
            platform_flag='--android'
            ;;
          ios)
            cache_hit='${{ steps.flutter-ios.outputs.cache-hit }}'
            platform_flag='--ios'
            ;;
          web)
            cache_hit='${{ steps.flutter-web.outputs.cache-hit }}'
            platform_flag='--web'
            ;;
          *)
            echo "Unsupported Flutter platform: ${{ inputs.platform }}"
            exit 1
            ;;
        esac
        if [ "$cache_hit" != 'true' ]; then
          mise exec -- flutter precache "$platform_flag"
        fi

    - name: Save host Flutter SDK
      if: >-
        ${{ inputs.platform == 'host' && inputs.cache-write == 'true' &&
        steps.flutter-host.outputs.cache-hit != 'true' &&
        github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
        key: >-
          mise-flutter-host-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}

    - name: Save ARM64 host Flutter SDK
      if: >-
        ${{ inputs.platform == 'host-arm64' && inputs.cache-write == 'true' &&
        steps.flutter-host-arm.outputs.cache-hit != 'true' &&
        github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
        key: >-
          mise-flutter-host-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}

    - name: Save Android Flutter SDK
      if: >-
        ${{ inputs.platform == 'android' && inputs.cache-write == 'true' &&
        steps.flutter-android.outputs.cache-hit != 'true' &&
        github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/linux-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm-profile/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm-release/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-arm64-profile/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-x86/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-x64*/**
        key: >-
          mise-flutter-android-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}

    - name: Save web Flutter SDK
      if: >-
        ${{ inputs.platform == 'web' && inputs.cache-write == 'true' &&
        steps.flutter-web.outputs.cache-hit != 'true' &&
        github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/linux-*/**
        key: >-
          mise-flutter-web-v4-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}

    - name: Save iOS Flutter SDK
      if: >-
        ${{ inputs.platform == 'ios' && inputs.cache-write == 'true' &&
        steps.flutter-ios.outputs.cache-hit != 'true' &&
        github.event_name != 'pull_request' }}
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.local/share/mise
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/android-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/artifacts/engine/linux-*/**
          !~/.local/share/mise/http-tarballs/*/bin/cache/flutter_web_sdk/**
        key: >-
          mise-flutter-ios-v1-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml') }}
