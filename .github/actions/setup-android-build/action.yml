name: Setup Android build
description: >
  Shared setup for Flutter Android APK jobs. Resolves ANDROID_HOME, ensures
  NDK + CMake, restores Gradle / pub / native-hook caches as independent
  keys so release can evolve native outputs without poisoning analyze/test.

inputs:
  cache-write:
    description: >
      When true, this job may write the native-hooks cache after a miss
      (release only). Pub and Gradle caches still write on miss via
      actions/cache@v5; prefer one trusted writer for native binaries.
    required: false
    default: 'false'

outputs:
  native-hooks-cache-hit:
    description: Whether the native hooks cache was restored.
    value: ${{ steps.native-hooks.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve Android SDK paths
      id: android
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        NDK_VERSION="28.2.13676358"
        CMAKE_VERSION="3.22.1"
        NDK_PATH="$SDK/ndk/$NDK_VERSION"
        CMAKE_PATH="$SDK/cmake/$CMAKE_VERSION"
        {
          echo "sdk=$SDK"
          echo "ndk_path=$NDK_PATH"
          echo "ndk_version=$NDK_VERSION"
          echo "cmake_path=$CMAKE_PATH"
          echo "cmake_version=$CMAKE_VERSION"
        } >> "$GITHUB_OUTPUT"
        {
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROID_NDK_HOME=$NDK_PATH"
        } >> "$GITHUB_ENV"
        echo "Resolved ANDROID_HOME=$SDK"
        if [ -d "$NDK_PATH" ]; then
          echo "ndk_present=true" >> "$GITHUB_OUTPUT"
        else
          echo "ndk_present=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -d "$CMAKE_PATH" ]; then
          echo "cmake_present=true" >> "$GITHUB_OUTPUT"
        else
          echo "cmake_present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache Android NDK
      id: ndk-cache
      if: steps.android.outputs.ndk_present != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.android.outputs.ndk_path }}
        key: ${{ runner.os }}-android-ndk-v2-${{ steps.android.outputs.ndk_version }}

    - name: Cache Android CMake
      id: cmake-cache
      if: steps.android.outputs.cmake_present != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.android.outputs.cmake_path }}
        key: ${{ runner.os }}-android-cmake-v2-${{ steps.android.outputs.cmake_version }}

    - name: Install Android NDK / CMake
      if: >-
        (steps.android.outputs.ndk_present != 'true' &&
         steps.ndk-cache.outputs.cache-hit != 'true') ||
        (steps.android.outputs.cmake_present != 'true' &&
         steps.cmake-cache.outputs.cache-hit != 'true')
      shell: bash
      run: |
        set -euo pipefail
        SDK="${{ steps.android.outputs.sdk }}"
        SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
        fi
        if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
          echo "::error::sdkmanager not found under $SDK"
          exit 1
        fi
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        pkgs=()
        if [ ! -d "${{ steps.android.outputs.ndk_path }}" ]; then
          pkgs+=("ndk;${{ steps.android.outputs.ndk_version }}")
        fi
        if [ ! -d "${{ steps.android.outputs.cmake_path }}" ]; then
          pkgs+=("cmake;${{ steps.android.outputs.cmake_version }}")
        fi
        if [ ${#pkgs[@]} -gt 0 ]; then
          "$SDKMANAGER" "${pkgs[@]}"
        fi

    # Selective Gradle paths — not the whole caches/ tree. Avoids the
    # multi-GB thrash that made setup-gradle slower than plain cache.
    - name: Cache Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/jars-9
          ~/.gradle/caches/transforms-3
          ~/.gradle/caches/transforms-4
          ~/.gradle/caches/build-cache-1
          ~/.gradle/wrapper
        key: >-
          gradle-v3-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('android/**/*.gradle*',
          'android/gradle/wrapper/gradle-wrapper.properties',
          'android/gradle.properties') }}
        restore-keys: |
          gradle-v3-${{ runner.os }}-${{ runner.arch }}-

    # Pub downloads only. Never mix .dart_tool here — package_config is
    # regenerated by pub get, and hooks_runner has its own cache below.
    - name: Cache pub package downloads
      uses: actions/cache@v5
      with:
        path: ~/.pub-cache
        key: >-
          pub-v3-${{ runner.os }}-${{ runner.arch }}-${{
          hashFiles('.mise.toml', 'pubspec.lock') }}
        restore-keys: |
          pub-v3-${{ runner.os }}-${{ runner.arch }}-

    - name: Get dependencies
      shell: bash
      run: mise exec -- flutter pub get

    # sodium (and other native-assets hooks) store checksummed outputs
    # under .dart_tool/hooks_runner. Exact key only — no restore-keys —
    # so a Flutter/NDK/ABI change never restores a stale .so.
    - name: Restore native hook outputs
      id: native-hooks
      uses: actions/cache/restore@v5
      with:
        path: .dart_tool/hooks_runner
        key: >-
          native-hooks-v3-${{ runner.os }}-${{ runner.arch }}-android-arm64-${{
          hashFiles('.mise.toml', 'pubspec.lock', 'android/gradle.properties',
          'android/app/build.gradle.kts') }}
