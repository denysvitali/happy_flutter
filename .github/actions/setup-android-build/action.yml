name: Setup Android build
description: >
  Shared setup for Flutter Android APK jobs. Resolves ANDROID_HOME (workflow
  env is empty at parse time), ensures NDK + CMake, restores Gradle User Home
  and pub via actions/cache (faster than setup-gradle for our workload).

inputs:
  cache-write:
    description: Unused (kept for call-site compatibility). Cache write is
      controlled by the job-level actions/cache step.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve Android SDK paths
      id: android
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        NDK_VERSION="28.2.13676358"
        CMAKE_VERSION="3.22.1"
        NDK_PATH="$SDK/ndk/$NDK_VERSION"
        CMAKE_PATH="$SDK/cmake/$CMAKE_VERSION"
        {
          echo "sdk=$SDK"
          echo "ndk_path=$NDK_PATH"
          echo "ndk_version=$NDK_VERSION"
          echo "cmake_path=$CMAKE_PATH"
          echo "cmake_version=$CMAKE_VERSION"
        } >> "$GITHUB_OUTPUT"
        {
          echo "ANDROID_HOME=$SDK"
          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROID_NDK_HOME=$NDK_PATH"
        } >> "$GITHUB_ENV"
        echo "Resolved ANDROID_HOME=$SDK"
        if [ -d "$NDK_PATH" ]; then
          echo "ndk_present=true" >> "$GITHUB_OUTPUT"
        else
          echo "ndk_present=false" >> "$GITHUB_OUTPUT"
        fi
        if [ -d "$CMAKE_PATH" ]; then
          echo "cmake_present=true" >> "$GITHUB_OUTPUT"
        else
          echo "cmake_present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache Android NDK
      id: ndk-cache
      if: steps.android.outputs.ndk_present != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.android.outputs.ndk_path }}
        key: ${{ runner.os }}-android-ndk-${{ steps.android.outputs.ndk_version }}

    - name: Cache Android CMake
      id: cmake-cache
      if: steps.android.outputs.cmake_present != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ steps.android.outputs.cmake_path }}
        key: ${{ runner.os }}-android-cmake-${{ steps.android.outputs.cmake_version }}

    - name: Install Android NDK / CMake
      if: >-
        (steps.android.outputs.ndk_present != 'true' &&
         steps.ndk-cache.outputs.cache-hit != 'true') ||
        (steps.android.outputs.cmake_present != 'true' &&
         steps.cmake-cache.outputs.cache-hit != 'true')
      shell: bash
      run: |
        set -euo pipefail
        SDK="${{ steps.android.outputs.sdk }}"
        SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
        fi
        if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
          echo "::error::sdkmanager not found under $SDK"
          exit 1
        fi
        yes | "$SDKMANAGER" --licenses >/dev/null || true
        pkgs=()
        if [ ! -d "${{ steps.android.outputs.ndk_path }}" ]; then
          pkgs+=("ndk;${{ steps.android.outputs.ndk_version }}")
        fi
        if [ ! -d "${{ steps.android.outputs.cmake_path }}" ]; then
          pkgs+=("cmake;${{ steps.android.outputs.cmake_version }}")
        fi
        if [ ${#pkgs[@]} -gt 0 ]; then
          "$SDKMANAGER" "${pkgs[@]}"
        fi

    # actions/cache is faster here than gradle/actions/setup-gradle: the latter
    # spent 93s restore + 60s post-save on a warm run vs ~22s restore + ~1s
    # post with the plain cache of ~/.gradle/{caches,wrapper}.
    - name: Cache Gradle
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache pub dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.pub-cache
          .dart_tool
        key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-

    - name: Get dependencies
      shell: bash
      run: mise exec -- flutter pub get
